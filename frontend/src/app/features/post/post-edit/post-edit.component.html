<app-nav></app-nav>
<div class="page-wrapper">
  <div class="container pb-16">

    <!-- Back -->
    <a routerLink="/" class="btn btn-ghost btn-sm mb-6 w-fit">
      Back to Feed
    </a>
    .
    <!-- Error Card -->
    <div *ngIf="errorMsg" class="card p-8 text-center animate-slide-up" style="max-width: 500px; margin: 40px auto; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <span style="font-size: 3.5rem; margin-bottom: 16px; display: block; filter: drop-shadow(0 4px 10px rgba(239, 68, 68, 0.2));">⚠️</span>
      <h2 class="text-display text-lg mb-2" style="font-size: 1.5rem; font-weight: 700;">Could Not Load Post</h2>
      <p class="text-body text-meta mb-6" style="margin-bottom: 24px; text-align: center; color: var(--text-muted);">{{errorMsg}}</p>
      <a routerLink="/" class="btn btn-primary" style="width: 100%; text-align: center; justify-content: center;">Back to Feed</a>
    </div>

    <div *ngIf="!errorMsg" class="animate-slide-up">
      <h1 class="text-display mb-2">Edit Experience</h1>
      <p class="text-body-large text-meta mb-8">Update your post details</p>

      <div class="card p-8">
        <form (ngSubmit)="onSubmit()" class="form-layout">

          <!-- Post Type -->
          <div class="input-group">
            <label class="input-label">Post Type</label>
            <div class="form-row form-row-2 mt-2">
              <div *ngFor="let t of postTypes" (click)="form.type = $any(t.value)" class="selectable-card"
                [class.selected]="form.type === t.value">
                <div class="selectable-card-content">
                  <div class="selectable-card-title">{{t.label}}</div>
                  <div class="selectable-card-desc">{{t.desc}}</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Title -->
          <div class="input-group">
            <label class="input-label">Title <span style="color:var(--error); margin-left:4px;">*</span></label>
            <input [(ngModel)]="form.title" name="title" type="text" required class="input-field"
              placeholder="e.g. Google SDE-2 Interview Experience – 2024">
          </div>

          <!-- Company + Role Row -->
          <div class="form-row form-row-2">
            <div class="input-group">
              <label class="input-label">Company</label>
              <div class="select-wrapper">
                <select [(ngModel)]="form.companyId" name="companyId" class="input-field">
                  <option value="">Select company…</option>
                  <option *ngFor="let c of companyService.companies()" [value]="c.id">{{c.name}}</option>
                  <option value="other">Other (Add Custom Company)</option>
                </select>
              </div>
              <input *ngIf="form.companyId === 'other'" [(ngModel)]="customCompany" name="customCompany" type="text"
                class="input-field mt-2" placeholder="Enter custom company name..." style="margin-top: 8px;"
                aria-label="Custom Company Name">
            </div>
            <div class="input-group">
              <label class="input-label">Role / Position</label>
              <input [(ngModel)]="form.role" name="role" type="text" class="input-field"
                placeholder="e.g. SDE-2, Data Scientist">
            </div>
          </div>

          <!-- Difficulty + Result Row -->
          <div class="form-row form-row-3">
            <div class="input-group">
              <label class="input-label">Difficulty</label>
              <div class="select-wrapper">
                <select [(ngModel)]="form.difficulty" name="difficulty" class="input-field">
                  <option value="">Select…</option>
                  <option value="Easy">Easy</option>
                  <option value="Medium">Medium</option>
                  <option value="Hard">Hard</option>
                  <option value="other">Other (Add Custom Difficulty)</option>
                </select>
              </div>
              <input *ngIf="form.difficulty === 'other'" [(ngModel)]="customDifficulty" name="customDifficulty"
                type="text" class="input-field mt-2" placeholder="Enter custom difficulty (e.g. Extreme)..."
                style="margin-top: 8px;" aria-label="Custom Difficulty Level">
            </div>
            <div class="input-group">
              <label class="input-label">Result</label>
              <div class="select-wrapper">
                <select [(ngModel)]="form.result" name="result" class="input-field">
                  <option value="">Select…</option>
                  <option value="Selected">Selected ✅</option>
                  <option value="Rejected">Rejected ❌</option>
                  <option value="Waitlisted">Waitlisted ⏳</option>
                  <option value="Pending">Pending 🔄</option>
                  <option value="other">Other (Add Custom Result)</option>
                </select>
              </div>
              <input *ngIf="form.result === 'other'" [(ngModel)]="customResult" name="customResult" type="text"
                class="input-field mt-2" placeholder="Enter custom result (e.g. Offered)..." style="margin-top: 8px;"
                aria-label="Custom Interview Result">
            </div>
            <div class="input-group">
              <label class="input-label">Location</label>
              <input [(ngModel)]="form.location" name="location" type="text" class="input-field"
                placeholder="e.g. Bengaluru">
            </div>
          </div>

          <!-- Salary -->
          <div class="input-group">
            <label class="input-label">Package / Salary (optional)</label>
            <input [(ngModel)]="form.salaryPackage" name="salaryPackage" type="number" class="input-field"
              placeholder="e.g. 3500000">
          </div>

          <!-- Content -->
          <div class="input-group">
            <label class="input-label">Your Experience <span
                style="color:var(--error); margin-left:4px;">*</span></label>
            <textarea [(ngModel)]="form.content" name="content" required class="input-field"
              placeholder="Describe your interview process step by step..."></textarea>
            <p class="text-xs text-meta mt-2">{{form.content?.length || 0}} characters</p>
          </div>

          <!-- Anonymous Toggle -->
          <div class="card p-4 flex items-center justify-between mt-2">
            <div class="flex-col gap-1">
              <div class="text-sm" style="font-weight:600;">Post Anonymously</div>
              <div class="text-xs text-meta">Your name won't be shown publicly</div>
            </div>
            <div class="toggle-switch" [class.active]="form.anonymous" (click)="form.anonymous = !form.anonymous">
              <div class="toggle-switch-thumb"></div>
            </div>
          </div>

          <!-- Error -->
          <div *ngIf="errorMsg" class="form-error">{{errorMsg}}</div>

          <div class="divider"></div>

          <!-- Actions -->
          <div class="flex items-center justify-end gap-3">
            <button type="button" routerLink="/" class="btn btn-ghost" [disabled]="submitting">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary btn-lg flex-1"
              [disabled]="submitting || !form.title || !form.content">
              {{submitting ? 'Saving Changes…' : 'Save Changes'}}
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

<style>
  .pb-16 {
    padding-bottom: var(--space-16);
  }

  .mb-6 {
    margin-bottom: var(--space-6);
  }

  .w-fit {
    width: fit-content;
  }
</style>
